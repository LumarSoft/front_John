# Dependabot: one pull request a week with every npm update (Lucas, 17/11/2026).
# The instant security-fix PRs are off in the repository settings; vulnerability
# alerts stay on and their fixes come in this weekly PR. Major versions are left
# out on purpose: they need a deliberate migration.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 1
    # pnpm refuses packages published less than a day ago (minimumReleaseAge).
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dependencias:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
